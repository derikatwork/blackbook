-- Blackbook conky
-- BunsenLabs-style desktop system info + keyboard shortcut cheatsheet.
-- Runs from the Openbox autostart. See 'man conky' for the config reference.

conky.config = {
    -- Window
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_colour = '000000',
    own_window_class = 'Conky',
    own_window_title = 'Blackbook Conky',

    gap_x = 24,
    gap_y = 48,
    alignment = 'top_right',

    -- Font
    use_xft = true,
    font = 'Sans:size=10',
    xftalpha = 1,
    override_utf8_locale = true,
    uppercase = false,

    -- Colour
    draw_shades = true,
    default_shade_color = '000000',
    draw_outline = false,
    default_color = 'CCCCCC',
    color1 = '5F9EA0',
    color2 = '9ACD32',

    -- Borders
    draw_borders = false,
    draw_graph_borders = false,

    -- Misc
    background = true,
    use_spacer = 'none',
    no_buffers = true,
    short_units = true,
    imlib_cache_size = 0,
    double_buffer = true,
    update_interval = 1,
};

conky.text = [[
${color1}B L A C K B O O K${color}
${hr}
Uptime:${alignr}${uptime_short}
RAM:${alignr}${mem} / ${memmax}
CPU:${alignr}${cpu cpu0}%
Disk:${alignr}${fs_used /} / ${fs_size /}
${if_existing /sys/class/power_supply/BAT0}Battery:${alignr}${battery_percent BAT0}%${endif}

${color1}S H O R T C U T   K E Y S${color}
${hr}
Super${alignr}Main Menu
Super + Tab${alignr}Window List
Super + t${alignr}Terminal
Super + w${alignr}Web Browser
Super + f${alignr}File Manager
Super + e${alignr}Text Editor
Super + m${alignr}Image Viewer
Super + v${alignr}Volume Control
Super + h${alignr}Task Manager
Super + l${alignr}Lock Screen
Super + x${alignr}Log Out
Alt + F2${alignr}Run Program
PrtSc${alignr}Screenshot

${color1}W I N D O W S${color}
${hr}
Alt + Tab${alignr}Switch
Alt + F4${alignr}Close
Alt + F5${alignr}Minimize
Alt + F6${alignr}Maximize
Super + arrow${alignr}Tile half
Super + Alt + arrow${alignr}Tile quarter
]];
