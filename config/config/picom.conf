# Blackbook picom compositor config
# Light compositing for shadows, fading and transparency - tuned to stay
# lightweight on older hardware, matching the BunsenLabs philosophy.

backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

# Slight transparency for panels and menus
opacity-rule = [
    "90:class_g = 'tint2'",
    "95:class_g = 'jgmenu'"
];

# Corners / blur (kept off for performance)
corner-radius = 0;

# Window-type behaviour
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
