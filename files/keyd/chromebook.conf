# keyd remapping for the Chromebook keyboard, modeled on ChromeOS.
#
# Based on the config that WeirdTreeThing/cros-keyboard-map generates for the
# default Chromebook top row:
#   Back, Forward, Refresh, Fullscreen, Overview, Brightness -/+, Mute, Volume -/+
# Older Chromebooks send F1-F10 from the top row and newer ("Vivaldi") ones
# send media keys, so both are mapped below and it works either way.
#
# To see the raw key names, stop keyd first (sudo systemctl stop keyd), run
# `sudo keyd monitor`, press keys, Ctrl+C, then `sudo systemctl start keyd`.
# While keyd runs, `sudo keyd monitor` and `wev` show the remapped result.
# After editing this file in the repo, apply it with sysupdate or
# nixos-rebuild. The [ids] section is added by modules/hardware.nix.

[main]
# Top row on its own: ChromeOS actions.
f1 = back
f2 = forward
f3 = refresh
# Fullscreen sends F11; labwc turns F11 into "make this window fullscreen".
f4 = f11
f5 = scale
f6 = brightnessdown
f7 = brightnessup
f8 = mute
f9 = volumedown
f10 = volumeup
zoom = f11

# Search (the key that sends Super/Meta) held down.
# Keys listed here are sent WITHOUT Super; all other keys keep Super, so
# shortcuts like Search+B still reach labwc.
[meta]
# Search + top row: the real F1-F10.
f1 = f1
f2 = f2
f3 = f3
f4 = f4
f5 = f5
f6 = f6
f7 = f7
f8 = f8
f9 = f9
f10 = f10
back = f1
forward = f2
refresh = f3
zoom = f4
scale = f5
brightnessdown = f6
brightnessup = f7
mute = f8
volumedown = f9
volumeup = f10
# Search + Backspace / arrows: Delete, Home, End, Page Up, Page Down.
backspace = delete
left = home
right = end
up = pageup
down = pagedown

[alt]
# Alt + Fullscreen: Alt+F4 (close the window). The "A-" keeps Alt held.
f4 = A-f4
zoom = A-f4

[control]
# Ctrl + Overview: Print Screen (labwc takes a full-screen screenshot).
f5 = sysrq
scale = sysrq

[control+alt]
# Ctrl + Alt + top-row key: switch to text console 1-10, as Ctrl+Alt+F1-F10
# would on a normal keyboard. Useful if the desktop ever freezes.
f1 = C-A-f1
f2 = C-A-f2
f3 = C-A-f3
f4 = C-A-f4
f5 = C-A-f5
f6 = C-A-f6
f7 = C-A-f7
f8 = C-A-f8
f9 = C-A-f9
f10 = C-A-f10
back = C-A-f1
forward = C-A-f2
refresh = C-A-f3
zoom = C-A-f4
scale = C-A-f5
brightnessdown = C-A-f6
brightnessup = C-A-f7
mute = C-A-f8
volumedown = C-A-f9
volumeup = C-A-f10
