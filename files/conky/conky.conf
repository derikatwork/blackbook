-- The info panel at the top right of the desktop: the time, battery, CPU,
-- memory, disk, network and updates, and the main keyboard shortcuts.
-- Installed as /etc/conky/conky.conf, which conky reads unless you have your
-- own ~/.config/conky/conky.conf. To change it, copy this file there, then
-- log out and back in; after that, conky reloads the copy whenever you save
-- it. `man conky` lists everything it can show.
-- Battery, network and update use the conky-info helper (files/bin).

conky.config = {
    -- Draw on the desktop under all windows (Wayland layer shell), not
    -- through XWayland.
    out_to_wayland = true,
    out_to_x = false,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 24,
    minimum_width = 330,
    maximum_width = 330,
    border_inner_margin = 14,

    -- A see-through dark box behind the text.
    own_window_transparent = false,
    own_window_colour = '1e2b36',
    own_window_argb_value = 170,

    font = 'Noto Sans:size=11',
    default_color = 'f6f5f4',
    color1 = '99c1f1', -- headings
    color2 = 'c0bfbc', -- the keys, and the date
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    default_bar_height = 6,

    update_interval = 2,
    cpu_avg_samples = 2,
    no_buffers = true, -- memory in use, without the disk cache
    use_spacer = 'none',
}

-- Values are right-aligned with ${alignr}: ${goto} columns land outside the
-- panel on Wayland when it sits at the right edge (conky 1.22).
conky.text = [[
${font Noto Sans:size=26}${time %I:%M %p}${font}
${color2}${time %A, %B %e}${color}

${color1}SYSTEM${color}
Battery${alignr}${execi 30 conky-info battery}
CPU${alignr}${cpu cpu0}%
${cpubar cpu0}
Memory${alignr}${mem} of ${memmax}
${membar}
Swap${alignr}${swap} of ${swapmax}
Disk${alignr}${fs_free /} free of ${fs_size /}
${fs_bar /}
Network${alignr}${execi 15 conky-info network}
Updates${alignr}${execi 300 conky-info update}
Up for${alignr}${uptime_short}

${color1}QUICK KEYS${color}
${color2}Search${color}${alignr}App launcher
${color2}Search+Enter${color}${alignr}Terminal
${color2}Search+B${color}${alignr}Firefox
${color2}Search+M${color}${alignr}Thunderbird
${color2}Search+E${color}${alignr}Files
${color2}Search+L${color}${alignr}Lock the screen
${color2}Search+Q${color}${alignr}Close the window
${color2}Alt+Tab${color}${alignr}Switch windows
${color2}Alt+[  Alt+]${color}${alignr}Snap left / right
${color2}Alt+=${color}${alignr}Maximize
${color2}Search+Shift+S${color}${alignr}Screenshot of an area
${color2}Search+Backspace${color}${alignr}Delete
${color2}Search+top row${color}${alignr}F1 to F10
${color2}All shortcuts${color}${alignr}⚙ in the panel
]]
