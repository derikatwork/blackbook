# App launcher settings. Installed as /etc/xdg/fuzzel/fuzzel.ini.
# Copy to ~/.config/fuzzel/fuzzel.ini to change it. See `man fuzzel.ini`.
# Colors are fuzzel's built-in light theme.

[main]
font=Noto Sans:size=16
icon-theme=Adwaita
terminal=foot -e
lines=10
width=40
layer=overlay

[border]
width=2
radius=10
